<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Kelola Toko & Pesanan</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .modal-container { max-width: 550px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h3 { color: #ee4d2d; margin-top: 0; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; color: #333; }
        input[type="text"], input[type="number"], input[type="file"], textarea {
            width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
        }
        textarea { resize: vertical; height: 80px; }
        .btn-simpan {
            width: 100%; margin-top: 20px; padding: 12px; background-color: #ee4d2d; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;
        }
        .btn-simpan:hover { background-color: #d7381b; }
    </style>
</head>
<body>

<div class="modal-container">
    <h3>Tambah Produk Baru</h3>
    <form id="formTambahProduk" onsubmit="simpanProduk(event)">
        
        <label for="namaProduk">Nama Produk</label>
        <input type="text" id="namaProduk" placeholder="Masukkan nama produk" required>

        <label for="hargaProduk">Harga (Rp)</label>
        <!-- type="number" memastikan hanya angka yang bisa diisi -->
        <input type="number" id="hargaProduk" placeholder="Contoh: 49000" min="0" required>

        <label for="gambarProduk">Upload Gambar Produk</label>
        <input type="file" id="gambarProduk" accept="image/*">

        <label for="videoProduk">Upload Video Produk (Opsional)</label>
        <input type="file" id="videoProduk" accept="video/*">

        <label for="deskripsiProduk">Deskripsi Produk</label>
        <textarea id="deskripsiProduk" placeholder="Tuliskan deskripsi produk..."></textarea>

        <button type="submit" class="btn-simpan">Simpan Produk</button>
    </form>
</div>

<script>
    function simpanProduk(event) {
        event.preventDefault();
        const nama = document.getElementById('namaProduk').value;
        const harga = document.getElementById('hargaProduk').value;
        const gambar = document.getElementById('gambarProduk').files[0];
        const video = document.getElementById('videoProduk').files[0];

        // Validasi tambahan untuk memastikan harga berupa angka murni
        if (isNaN(harga) || harga === "") {
            alert("Harga harus diisi dengan angka!");
            return;
        }

        alert(`Produk "${nama}" dengan harga Rp ${Number(harga).toLocaleString()} berhasil disimpan!`);
        // Di sini Anda bisa menambahkan logika tambahan atau reset form
    }
</script>

</body>
</html>
